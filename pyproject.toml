[project]
name = "lm-pocket"
version = "0.1.0.dev0"
description = "Longitudinal Memory Pocket: your AI memory, physically yours."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "sqlcipher3-wheels>=0.5.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "mcp>=1.9",
]

[project.scripts]
lm-pocket = "lm_pocket.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lm_pocket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
